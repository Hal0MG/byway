<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Byway</title>
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="description" content="Plan road trips around the best scenic driving roads." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body data-view="home">
  <div id="map" role="region" aria-label="Trip map"></div>

  <!-- Home: the globe with trip suggestions floating around it (home.js) -->
  <section id="home" aria-label="Home"></section>

  <header id="topbar">
    <button id="brand" class="brand" title="Home" aria-label="Home"></button>
    <div class="trip-title">
      <span class="wordmark">Byway</span>
      <span id="save-state" class="subtle" aria-live="polite"></span>
    </div>
    <nav class="seg" aria-label="View">
      <button data-view="home" aria-pressed="true"><span class="seg-ico" data-icon="globe"></span><span>Home</span></button>
      <button data-view="trips" aria-pressed="false"><span class="seg-ico" data-icon="list"></span><span>Trips</span></button>
      <button data-view="itinerary" aria-pressed="false"><span class="seg-ico" data-icon="book"></span><span>Itinerary</span></button>
      <button data-view="map" aria-pressed="false"><span class="seg-ico" data-icon="map"></span><span>Map</span></button>
      <button data-view="about" aria-pressed="false" title="How it works"><span class="seg-ico" data-icon="sparkle"></span><span>How it works</span></button>
    </nav>
    <div class="top-actions">
      <button id="trips-btn" class="icon-btn" aria-label="Your trips" data-icon="list"></button>
      <button id="setup-btn" class="icon-btn" aria-label="Setup" title="Setup" data-icon="gear"></button>
      <button id="lang-btn" class="icon-btn lang-btn" aria-label="Language" aria-haspopup="menu" aria-expanded="false"></button>
      <button id="theme-btn" class="icon-btn" aria-label="Switch between light and dark" data-icon="moon"></button>
    </div>
  </header>

  <!-- Itinerary: photos, day write-ups, roads and spots (filled by itinerary.js) -->
  <main id="itinerary" tabindex="-1"></main>

  <!-- Trips: your trips and the ready-made ones (library.js) -->
  <main id="library" tabindex="-1" aria-label="Trips"></main>

  <!-- How it works: a short tour of the app (about.js) -->
  <main id="about" tabindex="-1" aria-label="How it works"></main>

  <!-- Map view panel (a sheet on phones: the grip shows and hides the list) -->
  <aside id="panel" class="collapsed">
    <button id="panel-grip" class="panel-grip" type="button" aria-expanded="false" aria-controls="scroll"><span></span><b>Stops and days</b></button>
    <div id="options" hidden>
      <button class="option selected" id="opt-scenic" data-mode="scenic">
        <span class="swatch scenic"></span>
        <span class="label">Scenic</span>
        <span class="time"></span>
        <span class="meta"></span>
      </button>
      <button class="option" id="opt-fastest" data-mode="fastest">
        <span class="swatch fastest"></span>
        <span class="label">Fastest</span>
        <span class="time"></span>
        <span class="meta"></span>
      </button>
    </div>
    <div class="search">
      <span data-icon="plus"></span>
      <input id="search" type="text" placeholder="Add a stop" autocomplete="off" aria-label="Add a stop" />
      <button id="add-btn" class="chip-btn">Add</button>
    </div>
    <form id="change-form" class="search change" hidden>
      <span data-icon="sparkle"></span>
      <input id="change-text" type="text" placeholder="Change the trip: “skip Winnipeg”" autocomplete="off" aria-label="Change the trip" />
      <button class="chip-btn" type="submit">Go</button>
    </form>

    <div id="scroll">
      <p id="empty">Add a stop, or plan a trip from the Itinerary tab.</p>
      <ol id="stops"></ol>
    </div>

    <footer id="routes-card">
      <button id="fix-btn" class="btn soft" hidden>Fix long days with AI</button>
      <div class="btn-row">
        <button id="route-btn" class="btn ghost">Find routes</button>
        <button id="gpx-btn" class="btn ghost" hidden>Export GPX</button>
      </div>
      <p id="status" role="status"></p>
      <p class="credit">Routes: OpenRouteService, OSRM. Map data: OpenStreetMap. Photos and articles: Wikipedia, Wikimedia Commons.</p>
    </footer>
  </aside>

  <!-- Elevation of the day shown on the map (features.js) -->
  <div id="map-profile" hidden></div>

  <div id="toast" role="status" hidden></div>
  <div id="live-bar" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="icons.js"></script>
  <script src="logic.js"></script>
  <script src="sound.js"></script>
  <script src="i18n.js"></script>
  <script src="i18n-strings.js"></script>
  <script src="app.js"></script>
  <script src="itinerary.js"></script>
  <script src="features.js"></script>
  <script src="home.js"></script>
  <script src="setup.js"></script>
  <script src="welcome.js"></script>
  <script src="about-deep-i18n.js"></script>
  <script src="about-deep.js"></script>
  <script src="about.js"></script>
  <script src="library.js"></script>
</body>
</html>
