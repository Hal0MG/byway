# Render reports each deploy to GitHub, and a public repo shows those deployments (with the live site's address) in its
# sidebar. This deletes them as soon as they appear, and sweeps up any that slip through every six hours. It prints
# nothing about the deployment but its number.
name: Hide deployments

on:
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  deployments: write

jobs:
  hide:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete the deployment (or all of them, when run by hand or on the schedule)
        run: |
          if [ -n "${{ github.event.deployment.id }}" ]; then IDS="${{ github.event.deployment.id }}"; else IDS="$(gh api "repos/$REPO/deployments?per_page=100" --jq '.[].id')"; fi
          for id in $IDS; do
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null 2>&1 || true
            gh api -X DELETE "repos/$REPO/deployments/$id" > /dev/null 2>&1 || true
            echo "removed deployment $id"
          done
