# The public demo on Render's free plan (see docs/DEMO.md). The keys are entered in Render's dashboard when the
# service is created ("sync: false"), so they never sit in this repo.
services:
  - type: web
    name: byway
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: DEMO
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TAVILY_MONTHLY_LIMIT
        value: "300"
      - key: GEMINI_API_KEY
        sync: false
      # A free Upstash Redis database keeps the daily caps across the free plan's sleeps (docs/DEMO.md).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CONTACT
        sync: false
